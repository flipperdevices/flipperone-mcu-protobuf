syntax = "proto3";

package Flipper_One_Input;

enum Button {
    OK = 0;
    BACK = 1;
    KEY_1 = 2;
    KEY_2 = 3;
    POWER = 4;
    KEY_4 = 5;
    KEY_5 = 6;
    SW = 7;
    DOWN = 8;
    RIGHT = 9;
    LEFT = 10;
    UP = 11;
    PTT = 12;
}

// Mirrors InputType from the input service. PRESS and RELEASE are physical
// events; SHORT, LONG and REPEAT are the logical ones the input service
// derives from them for real buttons. Injected events are published as is,
// nothing is derived on the device, so the sender has to send every event
// the receiving code expects.
enum ButtonAction {
    PRESS = 0;
    RELEASE = 1;
    SHORT = 2;
    LONG = 3;
    REPEAT = 4;
}

message ButtonEvent {
    Button button = 1;
    ButtonAction action = 2;
}

enum TouchType {
    START = 0;
    MOVE = 1;
    END = 2;
}

message TouchEvent {
    TouchType type = 1;
    uint32 x = 2;
    uint32 y = 3;
    uint32 pressure = 4;
}
